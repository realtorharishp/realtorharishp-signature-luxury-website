  <head>

    <style>
      .mobileMenuButton,
      .mobileMenuPanel { display: none; }

      /* Keep full desktop navigation visible on laptops and desktop browser windows. */
      @media (min-width: 769px) and (max-width: 1100px) {
        .navbar {
          padding: 10px 3% !important;
          gap: 12px !important;
        }
        .navbar .brand img {
          width: 120px !important;
          height: 48px !important;
        }
        .navbar nav {
          display: flex !important;
          gap: 12px !important;
          align-items: center !important;
          flex-wrap: nowrap !important;
        }
        .navbar nav a {
          font-size: 11px !important;
          letter-spacing: .04em !important;
          white-space: nowrap !important;
        }
        .navbar > div:last-child .socialIcons {
          display: none !important;
        }
        .navbar .callButton {
          padding: 10px 12px !important;
          font-size: 12px !important;
          white-space: nowrap !important;
        }
        .mobileMenuButton,
        .mobileMenuPanel {
          display: none !important;
        }
      }

      /* Hamburger navigation only for tablets/phones. */
      @media (max-width: 768px) {
        .navbar {
          padding: 10px 4% !important;
          gap: 12px !important;
        }
        .navbar .brand img {
          width: 125px !important;
          height: 48px !important;
        }
        .navbar nav {
          display: none !important;
        }
        .navbar > div:last-child .socialIcons {
          display: none !important;
        }
        .navbar .callButton {
          padding: 10px 14px !important;
          font-size: 13px !important;
        }
        .mobileMenuButton {
          display: inline-flex;
          width: 44px;
          height: 44px;
          align-items: center;
          justify-content: center;
          border: 1px solid rgba(212,175,55,.55);
          border-radius: 12px;
          background: #fff;
          color: #111;
          font-size: 24px;
          line-height: 1;
          cursor: pointer;
          box-shadow: 0 8px 24px rgba(0,0,0,.08);
        }
        .mobileMenuPanel {
          position: fixed;
          top: 72px;
          left: 4%;
          right: 4%;
          z-index: 9999;
          background: rgba(255,255,255,.98);
          border: 1px solid rgba(212,175,55,.35);
          border-radius: 18px;
          box-shadow: 0 24px 60px rgba(0,0,0,.18);
          padding: 14px;
        }
        .mobileMenuPanel.open { display: block; }
        .mobileMenuPanel a {
          display: block;
          padding: 14px 12px;
          color: #111;
          text-decoration: none;
          text-transform: uppercase;
          letter-spacing: .08em;
          font-size: 14px;
          border-bottom: 1px solid #eee;
        }
        .mobileMenuPanel a:last-child {
          border-bottom: 0;
          color: #9a7412;
          font-weight: 800;
        }
      }

      @media (max-width: 520px) {
        .navbar .callButton { display: none !important; }
        .navbar .brand img { width: 112px !important; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      function enhanceNavigation() {
        const navbar = document.querySelector('.navbar');
        const nav = navbar?.querySelector('nav');
        if (!navbar || !nav) return;

        if (!nav.querySelector('[data-coming-soon]')) {
          const comingSoon = document.createElement('a');
          comingSoon.href = '/1600-swan-st/';
          comingSoon.textContent = 'Coming Soon';
          comingSoon.setAttribute('data-coming-soon', 'true');
          nav.appendChild(comingSoon);
        }

        if (!navbar.querySelector('.mobileMenuButton')) {
          const actionArea = navbar.lastElementChild;
          const button = document.createElement('button');
          button.className = 'mobileMenuButton';
          button.type = 'button';
          button.setAttribute('aria-label', 'Open navigation menu');
          button.setAttribute('aria-expanded', 'false');
          button.innerHTML = '&#9776;';

          if (actionArea) navbar.insertBefore(button, actionArea);
          else navbar.appendChild(button);

          const panel = document.createElement('div');
          panel.className = 'mobileMenuPanel';
          panel.innerHTML = `
            <a href="/#home">Home</a>
            <a href="/#listings">Listings</a>
            <a href="/#services">Services</a>
            <a href="/#about">About</a>
            <a href="/#contact">Contact</a>
            <a href="/1600-swan-st/">Coming Soon</a>
          `;
          document.body.appendChild(panel);

          const closeMenu = () => {
            panel.classList.remove('open');
            button.setAttribute('aria-expanded', 'false');
            button.innerHTML = '&#9776;';
          };

          button.addEventListener('click', () => {
            const isOpen = panel.classList.toggle('open');
            button.setAttribute('aria-expanded', String(isOpen));
            button.innerHTML = isOpen ? '&times;' : '&#9776;';
          });

          panel.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMenu));

          document.addEventListener('click', (event) => {
            if (!panel.classList.contains('open')) return;
            if (panel.contains(event.target) || button.contains(event.target)) return;
            closeMenu();
          });

          window.addEventListener('resize', () => {
            if (window.innerWidth > 768) closeMenu();
          });
        }
      }

      const navigationObserver = new MutationObserver(enhanceNavigation);
      navigationObserver.observe(document.body, { childList: true, subtree: true });
      enhanceNavigation();
    </script>
  </body>
</html>
